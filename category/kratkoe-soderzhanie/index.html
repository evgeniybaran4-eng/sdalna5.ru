<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Краткое содержание — Сдал на 5</title>
    <meta name="description" content="Все материалы раздела Краткое содержание: списки произведений, разборы, краткие содержания.">
    <link rel="canonical" href="https://sdalna5ru.vercel.app/category/kratkoe-soderzhanie/">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f8fafc; margin:0; padding:0; color:#1e293b; line-height: 1.6; }
        header { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 0.5rem 0; position: sticky; top: 0; z-index: 50; }
        .header-inner { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; }
        .container { max-width: 1000px; margin: 0 auto; padding: 0 1rem; }
        .logo { font-size: 1.3rem; font-weight: 700; color: #2563eb; text-decoration: none; white-space: nowrap; }
        
        .menu-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 1.1rem;
            cursor: pointer;
            color: #0f172a;
        }
        
        .nav-categories {
            display: none;
            width: 100%;
            flex-direction: column;
            gap: 0.4rem;
            padding: 0.75rem 0 0.5rem;
            border-top: 1px solid #e2e8f0;
            margin-top: 0.5rem;
        }
        .nav-categories.is-open { display: flex; }
        .nav-categories a { color: #4b5563; font-weight: 500; padding: 0.5rem 0.75rem; border-radius: 6px; background: #f8fafc; text-decoration: none; }
        .nav-categories a:hover { color: #2563eb; background: #eff6ff; }

        @media (min-width: 860px) {
            .menu-toggle { display: none; }
            .nav-categories {
                display: flex !important;
                width: auto;
                flex-direction: row;
                gap: 0.75rem;
                padding: 0;
                border-top: none;
                margin-top: 0;
            }
            .nav-categories a { background: transparent; padding: 0.35rem 0.6rem; }
        }

        .breadcrumbs { padding: 1rem 0; font-size: 0.875rem; color: #64748b; }
        .breadcrumbs a { color: #64748b; text-decoration: none; }
        .hero { padding: 2rem 0 1.5rem; }
        .hero h1 { font-size: 2rem; font-weight: 800; margin-bottom: 0.5rem; color: #0f172a; }
        .hero p { color: #64748b; font-size: 1.05rem; }
        a { text-decoration: none; }
        a:hover { color: #2563eb; }
        footer { text-align: center; padding: 2.5rem 0; border-top: 1px solid #e2e8f0; color: #64748b; font-size: 0.9rem; margin-top: 4rem; }
    </style>
</head>
<body>
    <header>
        <div class="container header-inner">
            <a href="/" class="logo">📚 Сдал на 5</a>
            <button class="menu-toggle" id="menuToggle" aria-label="Открыть меню">☰ Меню</button>
            <nav class="nav-categories" id="navCategories">
                <a href="/category/chitatelskiy-dnevnik/">📖 Читательский дневник</a>
                <a href="/category/kratkoe-soderzhanie/">⏱️ Краткие содержания</a>
                <a href="/category/analiz-proizvedeniy/">🔍 Анализ произведений</a>
                <a href="/category/harakteristika-geroev/">👤 Герои</a>
            </nav>
        </div>
    </header>
    <div class="container">
        <nav class="breadcrumbs">
            <a href="/">Главная</a> <span>/</span> <span style="color:#0f172a; font-weight:500;">Краткое содержание</span>
        </nav>
        <div class="hero">
            <h1>Краткое содержание</h1>
            <p>Материалы и готовые ответы по разделу (всего: 0)</p>
        </div>
        <div style="margin-bottom: 4rem;">
            <p style="color:#94a3b8; padding: 1rem 0;">В этой категории пока нет опубликованных статей.</p>
        </div>
    </div>
    <footer>
        <div class="container">
            <p>© 2026 Сдал на 5 — образовательный справочник</p>
        </div>
    </footer>

    <script>
    (function() {
        var toggle = document.getElementById('menuToggle');
        var nav = document.getElementById('navCategories');
        if (toggle && nav) {
            toggle.addEventListener('click', function() {
                nav.classList.toggle('is-open');
                toggle.textContent = nav.classList.contains('is-open') ? '✕ Закрыть' : '☰ Меню';
            });
        }
    })();
    </script>
</body>
</html>
